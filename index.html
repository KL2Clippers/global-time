<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GLOBAL OPS — World Time Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #080a0f; --card: #10131c; --card-hover: #161a27;
            --border: rgba(255,255,255,0.06); --border-bright: rgba(255,255,255,0.12);
            --text: #e8eaf0; --text-muted: #5a6070; --text-dim: #3a4050;
            --accent-blue: #4a9fff; --accent-cyan: #00d4aa; --accent-amber: #ffb340;
            --active: #00e887; --inactive: #2a3040;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: var(--bg); color: var(--text); font-family: 'Outfit', sans-serif; min-height: 100vh; padding: 20px; }
        .wrapper { max-width: 1400px; margin: 0 auto; }
        header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 20px; border-bottom: 1px solid var(--border); }
        .logo { font-weight: 700; letter-spacing: 2px; color: var(--accent-blue); font-size: 16px; }
        .hdr-clock { font-family: 'DM Mono', monospace; color: var(--accent-cyan); font-size: 20px; }
        
        /* 메인 레이아웃: 왼쪽 텍스트 맵, 오른쪽 서울 카드 */
        .main-layout { display: grid; grid-template-columns: 1fr 320px; gap: 20px; margin-top: 20px; }
        
        /* NEW 텍스트 월드 맵 스타일 */
        .map-panel { background: var(--card); border-radius: 15px; border: 1px solid var(--border-bright); padding: 30px; position: relative; }
        .text-map { font-family: 'DM Mono', monospace; font-size: 12px; line-height: 1.6; color: var(--text-dim); text-align: center; white-space: pre; border-radius: 10px; padding: 20px; background: rgba(0,0,0,0.2); }
        .map-label { color: var(--accent-cyan); font-weight: 600; font-size: 14px; margin-bottom: 15px; }

        .seoul-card { background: var(--card); border-radius: 15px; border: 1px solid var(--accent-cyan); padding: 30px; text-align: center; display: flex; flex-direction: column; justify-content: center; }
        
        .region-group { margin-top: 35px; }
        .region-title { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; font-size: 11px; letter-spacing: 2px; color: var(--text-muted); font-weight: 600; }
        .region-title::after { content: ""; flex: 1; height: 1px; background: var(--border); }
        
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 15px; }
        .card { background: var(--card); border: 1px solid var(--border); padding: 22px; border-radius: 14px; transition: 0.25s; position: relative; }
        .card:hover { background: var(--card-hover); transform: translateY(-4px); border-color: var(--border-bright); }
        
        /* 대륙별 컬러 표시 */
        .card::before { content: ""; position: absolute; top: 0; left: 0; width: 4px; height: 100%; border-radius: 14px 0 0 14px; }
        #am .card::before { background: var(--accent-blue); }
        #eu .card::before { background: var(--accent-amber); }
        #me .card::before { background: var(--accent-amber); }
        #as .card::before { background: var(--accent-cyan); }

        .card-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; padding-left: 8px; }
        .city-name { font-weight: 600; font-size: 16px; letter-spacing: -0.02em; }
        
        .status { font-size: 9px; font-weight: 800; padding: 3px 7px; border-radius: 4px; border: 1px solid; }
        .status.on { color: var(--active); border-color: rgba(0,232,135,0.3); background: rgba(0,232,135,0.06); }
        .status.off { color: var(--text-dim); border-color: var(--inactive); }
        
        .time { font-family: 'DM Mono', monospace; font-size: 28px; margin-bottom: 6px; padding-left: 8px; }
        .date { font-size: 11px; color: var(--text-muted); font-family: 'DM Mono', monospace; padding-left: 8px; }
        
        /* 모바일 대응 */
        @media (max-width: 900px) {
            .main-layout { grid-template-columns: 1fr; }
            .text-map { font-size: 8px; white-space: nowrap; overflow-x: auto; }
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <header>
            <div class="logo">GLOBAL OPS DASHBOARD</div>
            <div class="hdr-clock" id="hdr-clock">00:00:00</div>
        </header>

        <div class="main-layout">
            <div class="map-panel">
                <div class="map-label">🌍 GLOBAL MARKET PRESENCE (Text-Map Mode)</div>
                <div class="text-map">
[AMERICAS]         [EUROPE / MEA]           [ASIA / OCEANIA]
                     Stockholm
                  London      Moscow
  San Francisco      Geneva                  Seoul
    Los Angeles   Barcelona  Istanbul     Shanghai
DR                     Dubai
                     Riyadh                  Mumbai
                     

                     Angola
                                             Sydney
                                           Melbourne
                </div>
            </div>
            <div class="seoul-card">
                <div style="font-size:11px; color:var(--accent-cyan); letter-spacing: 2px; margin-bottom:12px;">BASE CITY</div>
                <h2 style="margin-bottom:8px; font-size:24px;">Seoul</h2>
                <div class="time" id="seoul-time" style="color:#fff; font-size:38px; padding-left:0;">00:00:00</div>
                <div class="date" id="seoul-date" style="font-size:13px; color:var(--text-muted); margin-top:5px; padding-left:0;">---</div>
            </div>
        </div>

        <div id="regions-wrap"></div>
    </div>

    <script>
        const REGIONS = [
            { id:'am', label:'AMERICAS', cities:[
                { name:'Dominican Republic', tz:'America/Santo_Domingo' },
                { name:'Los Angeles', tz:'America/Los_Angeles' },
                { name:'San Francisco', tz:'America/Los_Angeles' }
            ]},
            { id:'eu', label:'EUROPE', cities:[
                { name:'Amsterdam', tz:'Europe/Amsterdam' },
                { name:'Barcelona', tz:'Europe/Madrid' },
                { name:'Geneva', tz:'Europe/Zurich' },
                { name:'London', tz:'Europe/London' },
                { name:'Moscow', tz:'Europe/Moscow' },
                { name:'Stockholm', tz:'Europe/Stockholm' }
            ]},
            { id:'me', label:'MIDDLE EAST & AFRICA', cities:[
                { name:'Angola', tz:'Africa/Luanda' },
                { name:'Dubai', tz:'Asia/Dubai' },
                { name:'Istanbul', tz:'Europe/Istanbul' },
                { name:'Riyadh', tz:'Asia/Riyadh' }
            ]},
            { id:'as', label:'ASIA & OCEANIA', cities:[
                { name:'Melbourne', tz:'Australia/Melbourne' },
                { name:'Mumbai', tz:'Asia/Kolkata' },
                { name:'Shanghai', tz:'Asia/Shanghai' },
                { name:'Sydney', tz:'Australia/Sydney' }
            ]}
        ];

        function init() {
            const wrap = document.getElementById('regions-wrap');
            wrap.innerHTML = '';

            REGIONS.forEach(reg => {
                const group = document.createElement('div');
                group.className = 'region-group';
                group.id = reg.id;
                group.innerHTML = `<div class="region-title">${reg.label}</div><div class="grid" id="grid-${reg.id}"></div>`;
                wrap.appendChild(group);

                reg.cities.forEach((c, i) => {
                    const grid = document.getElementById(`grid-${reg.id}`);
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <div class="card-top">
                            <div class="city-name">${c.name}</div>
                            <div class="status" id="st-${reg.id}-${i}">OFF</div>
                        </div>
                        <div class="time" id="tm-${reg.id}-${i}">00:00</div>
                        <div class="date" id="dt-${reg.id}-${i}">---</div>
                    `;
                    grid.appendChild(card);
                });
            });
            update();
            setInterval(update, 1000);
        }

        function update() {
            const now = new Date();
            const seoulTime = now.toLocaleTimeString('en-GB', {timeZone:'Asia/Seoul'});
            document.getElementById('hdr-clock').textContent = seoulTime;
            document.getElementById('seoul-time').textContent = seoulTime;
            document.getElementById('seoul-date').textContent = now.toLocaleDateString('ko-KR', {weekday:'long', month:'long', day:'numeric'});

            REGIONS.forEach(reg => {
                reg.cities.forEach((c, i) => {
                    const timeStr = now.toLocaleTimeString('en-GB', {timeZone:c.tz, hour:'2-digit', minute:'2-digit'});
                    const hour = parseInt(timeStr.split(':')[0]);
                    
                    document.getElementById(`tm-${reg.id}-${i}`).textContent = timeStr;
                    document.getElementById(`dt-${reg.id}-${i}`).textContent = now.toLocaleDateString('en-GB', {timeZone:c.tz, month:'short', day:'numeric'});
                    
                    const isOpen = hour >= 9 && hour < 18;
                    const st = document.getElementById(`st-${reg.id}-${i}`);
                    st.textContent = isOpen ? 'OPEN' : 'OFF';
                    st.className = `status ${isOpen ? 'on' : 'off'}`;
                });
            });
        }

        init();
    </script>
</body>
</html>

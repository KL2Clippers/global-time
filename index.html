<style>
:root{
  --bg:#080a0f;--bg2:#0d1018;--bg3:#131620;
  --card:#10131c;--card-hover:#161a27;
  --border:rgba(255,255,255,0.06);--border-bright:rgba(255,255,255,0.12);
  --text:#e8eaf0;--text-muted:#5a6070;--text-dim:#3a4050;
  --accent-blue:#4a9fff;--accent-cyan:#00d4aa;--accent-amber:#ffb340;--accent-rose:#ff6b6b;
  --active:#00e887;--active-glow:rgba(0,232,135,0.2);--inactive:#2a3040;
  --region-am:#4a9fff;--region-eu:#a78bfa;--region-me:#ffb340;--region-as:#00d4aa;--region-kr:#ff6b9d;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:'Outfit',sans-serif;font-weight:300;min-height:100vh;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 800px 500px at 15% 20%,rgba(74,159,255,.04) 0%,transparent 70%),radial-gradient(ellipse 600px 400px at 85% 70%,rgba(167,139,250,.04) 0%,transparent 70%);pointer-events:none;z-index:0}
.wrapper{position:relative;z-index:1;max-width:1480px;margin:0 auto;padding:0 24px 80px}
header{display:flex;align-items:center;justify-content:space-between;padding:28px 0 20px;border-bottom:1px solid var(--border);flex-wrap:wrap;gap:16px}
.logo-group{display:flex;align-items:center;gap:14px}
.logo-mark{width:36px;height:36px;border-radius:8px;background:linear-gradient(135deg,var(--accent-blue),var(--accent-cyan));display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;color:#000;flex-shrink:0}
.logo-text{font-size:13px;font-weight:600;letter-spacing:.18em;text-transform:uppercase}
.logo-sub{font-size:11px;letter-spacing:.12em;color:var(--text-muted);text-transform:uppercase;margin-top:2px}
.header-right{display:flex;align-items:center;gap:16px}
.seoul-hdr{text-align:right}
.seoul-hdr-label{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-muted);margin-bottom:2px}
.seoul-hdr-time{font-family:'DM Mono',monospace;font-size:22px;font-weight:400;color:var(--accent-cyan);letter-spacing:.04em;line-height:1}
.seoul-hdr-date{font-size:11px;color:var(--text-muted);margin-top:3px;font-family:'DM Mono',monospace;letter-spacing:.06em}
.status-dot{width:8px;height:8px;border-radius:50%;background:var(--active);box-shadow:0 0 8px var(--active),0 0 16px var(--active-glow);animation:blink 2s ease-in-out infinite;flex-shrink:0}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.6}}
.top-section{display:grid;grid-template-columns:1fr 340px;gap:16px;margin-top:24px;align-items:start}
.panel{background:var(--card);border:1px solid var(--border-bright);border-radius:16px;padding:20px 22px;position:relative;overflow:hidden}
.panel-accent{position:absolute;top:0;left:0;right:0;height:1px}
.panel-hdr{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.panel-title{font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--text-muted)}
#worldSvg{width:100%;height:auto;display:block;border-radius:8px}
.map-tooltip{position:absolute;background:rgba(10,13,22,.97);border:1px solid var(--border-bright);border-radius:10px;padding:10px 14px;pointer-events:none;opacity:0;transition:opacity .15s;z-index:20;min-width:140px;backdrop-filter:blur(8px)}
.map-tooltip.show{opacity:1}
.tt-city{font-size:13px;font-weight:600;color:var(--text)}
.tt-time{font-family:'DM Mono',monospace;font-size:20px;color:var(--accent-cyan);letter-spacing:.03em;margin-top:3px}
.right-col{display:flex;flex-direction:column;gap:14px}
.seoul-panel{background:var(--card);border:1px solid rgba(255,109,157,.22);border-radius:16px;padding:20px 22px;position:relative;overflow:hidden}
.seoul-panel .panel-accent{background:linear-gradient(90deg,transparent,var(--region-kr),transparent);opacity:.7}
.seoul-tag{font-size:10px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--region-kr);opacity:.85;margin-bottom:6px}
.seoul-city{font-size:18px;font-weight:700;color:#fff;letter-spacing:-.01em}
.seoul-big-time{font-family:'DM Mono',monospace;font-size:38px;font-weight:400;color:#fff;letter-spacing:-.03em;line-height:1}
.seoul-big-date{font-family:'DM Mono',monospace;font-size:11px;color:var(--text-muted);letter-spacing:.06em;margin-top:6px}
.seoul-badge{display:inline-flex;align-items:center;gap:5px;margin-top:10px;padding:3px 10px;border-radius:100px;border:1px solid;font-size:9px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.seoul-badge.on{color:var(--active);border-color:rgba(0,232,135,.3);background:rgba(0,232,135,.08)}
.seoul-badge.off{color:var(--text-dim);border-color:var(--inactive)}

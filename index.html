<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GLOBAL OPS — World Time Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #080a0f; --card: #10131c; --card-hover: #161a27;
            --border: rgba(255,255,255,0.06); --border-bright: rgba(255,255,255,0.12);
            --text: #e8eaf0; --text-muted: #5a6070; --text-dim: #3a4050;
            --accent-blue: #4a9fff; --accent-cyan: #00d4aa; --accent-amber: #ffb340;
            --active: #00e887; --inactive: #2a3040;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: var(--bg); color: var(--text); font-family: 'Outfit', sans-serif; min-height: 100vh; padding: 20px; }
        .wrapper { max-width: 1400px; margin: 0 auto; }
        header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 20px; border-bottom: 1px solid var(--border); }
        .logo { font-weight: 700; letter-spacing: 2px; color: var(--accent-blue); }
        .hdr-clock { font-family: 'DM Mono', monospace; color: var(--accent-cyan); font-size: 20px; }
        .main-layout { display: grid; grid-template-columns: 1fr 320px; gap: 20px; margin-top: 20px; }
        .map-panel { background: var(--card); border-radius: 15px; border: 1px solid var(--border-bright); padding: 25px; position: relative; }
        #world-svg { width: 100%; height: auto; background: #0d111a; border-radius: 10px; }
        .land { fill: #242c3d; stroke: #2d364a; stroke-width: 0.4; }
        .seoul-card { background: var(--card); border-radius: 15px; border: 1px solid var(--accent-cyan); padding: 30px; text-align: center; display: flex; flex-direction: column; justify-content: center; }
        .calc-bar { background: var(--card); margin-top: 20px; padding: 15px 25px; border-radius: 10px; display: flex; align-items: center; gap: 15px; border: 1px solid var(--border); }
        .calc-bar input { background: #1a1f2e; border: 1px solid var(--border-bright); color: #fff; padding: 8px; border-radius: 5px; outline: none; }
        .calc-bar button { background: var(--accent-blue); border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-weight: 600; color: #000; }
        .region-group { margin-top: 35px; }
        .region-title { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; font-size: 11px; letter-spacing: 2px; color: var(--text-muted); font-weight: 600; }
        .region-title::after { content: ""; flex: 1; height: 1px; background: var(--border); }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 15px; }
        .card { background: var(--card); border: 1px solid var(--border); padding: 22px; border-radius: 14px; transition: 0.25s; }
        .card:hover { background: var(--card-hover); transform: translateY(-4px); border-color: var(--border-bright); }
        .card-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .city-name { font-weight: 600; font-size: 16px; letter-spacing: -0.02em; }
        .status { font-size: 9px; font-weight: 800; padding: 3px 7px; border-radius: 4px; border: 1px solid; letter-spacing: 0.05em; }
        .status.on { color: var(--active); border-color: rgba(0,232,135,0.3); background: rgba(0,232,135,0.06); }
        .status.off { color: var(--text-dim); border-color: var(--inactive); background: rgba(42,48,64,0.2); }
        .time { font-family: 'DM Mono', monospace; font-size: 28px; margin-bottom: 6px; letter-spacing: -0.03em; }
        .date { font-size: 11px; color: var(--text-muted); font-family: 'DM Mono', monospace; }
        .offset { font-size: 9px; color: var(--text-dim); margin-top: 8px; font-family: 'DM Mono'; }
    </style>
</head>
<body>
    <div class="wrapper">
        <header>
            <div class="logo">GLOBAL OPS DASHBOARD</div>
            <div class="hdr-clock" id="hdr-clock">00:00:00</div>
        </header>

        <div class="main-layout">
            <div class="map-panel">
                <svg id="world-svg" viewBox="0 0 1000 500">
                    <g class="land">
                        <path d="M165,115 L180,110 L205,115 L215,130 L210,150 L185,160 L160,150 L155,130 Z M50,150 L100,140 L150,145 L180,165 L200,195 L205,220 L190,250 L170,270 L145,300 L135,330 L110,340 L80,310 L60,260 L45,210 L45,170 Z M155,345 L180,335 L210,345 L240,375 L250,410 L245,450 L220,485 L180,495 L160,460 L150,400 Z M460,140 L490,135 L500,155 L485,170 L465,165 Z M430,165 L470,155 L510,165 L530,185 L525,210 L500,225 L470,230 L440,215 L430,190 Z M490,125 L550,115 L620,110 L700,115 L780,125 L830,150 L825,180 L790,195 L700,190 L600,200 L500,195 L485,150 Z M520,225 L570,215 L600,225 L610,245 L590,260 L550,255 L520,240 Z M560,270 L610,260 L630,280 L640,310 L620,335 L580,335 L555,300 Z M450,235 L500,225 L540,240 L555,270 L550,310 L535,350 L520,400 L510,450 L490,490 L460,480 L445,430 L440,350 L435,280 Z M615,235 L660,225 L685,245 L690,280 L675,315 L640,325 L615,280 Z M710,185 L780,175 L830,190 L840,220 L825,250 L780,260 L720,250 L705,210 Z M750,415 L820,405 L870,420 L890,450 L880,480 L840,495 L790,490 L755,460 Z"/>
                    </g>
                    <g id="pins-layer"></g>
                </svg>
            </div>
            <div class="seoul-card">
                <div style="font-size:11px; color:var(--accent-cyan); letter-spacing: 2px; margin-bottom:12px;">BASE CITY</div>
                <h2 style="margin-bottom:8px; font-size:24px;">Seoul</h2>
                <div class="time" id="seoul-time" style="color:#fff; font-size:38px;">00:00:00</div>
                <div class="date" id="seoul-date" style="font-size:13px; color:var(--text-muted); margin-top:5px;">---</div>
            </div>
        </div>

        <div class="calc-bar">
            <span style="font-size:13px; font-weight:600;">⏱ 서울 시간 입력 시 전 세계 자동 변환:</span>
            <input type="time" id="calc-input">
            <button onclick="applyCalc()">적용</button>
            <button onclick="resetCalc()" style="background:none; color:var(--text-muted); border:1px solid var(--border);">실시간</button>
        </div>

        <div id="regions-wrap"></div>
    </div>

    <script>
        const REGIONS = [
            { id:'am', label:'AMERICAS', color:'#4a9fff', cities:[
                { name:'Dominican Republic', tz:'America/Santo_Domingo', lat:18.5, lon:-69.9 },
                { name:'Los Angeles', tz:'America/Los_Angeles', lat:34.1, lon:-118.2 },
                { name:'San Francisco', tz:'America/Los_Angeles', lat:37.8, lon:-122.4 }
            ]},
            { id:'eu', label:'EUROPE', color:'#a78bfa', cities:[
                { name:'Amsterdam', tz:'Europe/Amsterdam', lat:52.4, lon:4.9 },
                { name:'Barcelona', tz:'Europe/Madrid', lat:41.4, lon:2.2 },
                { name:'Geneva', tz:'Europe/Zurich', lat:46.2, lon:6.1 },
                { name:'London', tz:'Europe/London', lat:51.5, lon:-0.1 },
                { name:'Moscow', tz:'Europe/Moscow', lat:55.8, lon:37.6 },
                { name:'Stockholm', tz:'Europe/Stockholm', lat:59.3, lon:18.1 }
            ]},
            { id:'me', label:'MIDDLE EAST & AFRICA', color:'#ffb340', cities:[
                { name:'Angola', tz:'Africa/Luanda', lat:-8.8, lon:13.2 },
                { name:'Dubai', tz:'Asia/Dubai', lat:25.3, lon:55.3 },
                { name:'Istanbul', tz:'Europe/Istanbul', lat:41.0, lon:29.0 },
                { name:'Riyadh', tz:'Asia/Riyadh', lat:24.7, lon:46.7 }
            ]},
            { id:'as', label:'ASIA & OCEANIA', color:'#00d4aa', cities:[
                { name:'Melbourne', tz:'Australia/Melbourne', lat:-37.8, lon:144.9 },
                { name:'Mumbai', tz:'Asia/Kolkata', lat:19.1, lon:72.9 },
                { name:'Shanghai', tz:'Asia/Shanghai', lat:31.2, lon:121.5 },
                { name:'Sydney', tz:'Australia/Sydney', lat:-33.9, lon:151.2 }
            ]}
        ];

        let calcOffset = 0;
        const xy = (lat, lon) => ({ 
            x: (lon + 180) * (1000 / 360), 
            y: (90 - lat) * (500 / 180) 
        });

        function init() {
            const wrap = document.getElementById('regions-wrap');
            const pins = document.getElementById('pins-layer');
            wrap.innerHTML = ''; pins.innerHTML = '';

            REGIONS.forEach(reg => {
                const group = document.createElement('div');
                group.className = 'region-group';
                group.innerHTML = `<div class="region-title">${reg.label}</div><div class="grid" id="grid-${reg.id}"></div>`;
                wrap.appendChild(group);

                reg.cities.forEach((c, i) => {
                    const grid = document.getElementById(`grid-${reg.id}`);
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <div class="card-top">
                            <div class="city-name">${c.name}</div>
                            <div class="status" id="st-${reg.id}-${i}">OFF</div>
                        </div>
                        <div class="time" id="tm-${reg.id}-${i}">00:00</div>
                        <div class="date" id="dt-${reg.id}-${i}">---</div>
                        <div class="offset" id="of-${reg.id}-${i}">-0h vs Seoul</div>
                    `;
                    grid.appendChild(card);

                    const pos = xy(c.lat, c.lon);
                    const dot = document.createElementNS("http://www.w3.org/2000/svg", "circle");
                    dot.setAttribute("cx", pos.x); dot.setAttribute("cy", pos.y); dot.setAttribute("r", 4.5);
                    dot.setAttribute("fill", reg.color);
                    dot.style.filter = `drop-shadow(0 0 3px ${reg.color})`;
                    pins.appendChild(dot);
                    
                    const txt = document.createElementNS("http://www.w3.org/2000/svg", "text");
                    txt.setAttribute("x", pos.x + 8); txt.setAttribute("y", pos.y + 4);
                    txt.setAttribute("fill", "#fff"); txt.setAttribute("font-size", "11");
                    txt.setAttribute("font-weight", "600");
                    txt.style.textShadow = "0 0 3px #000";
                    txt.textContent = c.name;
                    pins.appendChild(txt);
                });
            });
            update();
            setInterval(update, 1000);
        }

        function update() {
            const now = new Date(Date.now() + calcOffset);
            const seoulTime = now.toLocaleTimeString('en-GB', {timeZone:'Asia/Seoul'});
            document.getElementById('hdr-clock').textContent = seoulTime;
            document.getElementById('seoul-time').textContent = seoulTime;
            document.getElementById('seoul-date').textContent = now.toLocaleDateString('ko-KR', {weekday:'long', month:'long', day:'numeric'});

            REGIONS.forEach(reg => {
                reg.cities.forEach((c, i) => {
                    const timeStr = now.toLocaleTimeString('en-GB', {timeZone:c.tz, hour:'2-digit', minute:'2-digit'});
                    const hour = parseInt(timeStr.split(':')[0]);
                    
                    // 시차 계산
                    const seoulHour = parseInt(seoulTime.split(':')[0]);
                    const diff = hour - seoulHour;
                    const diffTxt = diff >= 0 ? `+${diff}h` : `${diff}h`;

                    document.getElementById(`tm-${reg.id}-${i}`).textContent = timeStr;
                    document.getElementById(`dt-${reg.id}-${i}`).textContent = now.toLocaleDateString('en-GB', {timeZone:c.tz, month:'short', day:'numeric'});
                    document.getElementById(`of-${reg.id}-${i}`).textContent = `${diffTxt} vs Seoul`;
                    
                    const isOpen = hour >= 9 && hour < 18;
                    const st = document.getElementById(`st-${reg.id}-${i}`);
                    st.textContent = isOpen ? 'OPEN' : 'OFF';
                    st.className = `status ${isOpen ? 'on' : 'off'}`;
                });
            });
        }

        function applyCalc() {
            const val = document.getElementById('calc-input').value;
            if(!val) return;
            const [h, m] = val.split(':').map(Number);
            const seoulNow = new Date(new Date().toLocaleString("en-US", {timeZone: "Asia/Seoul"}));
            const target = new Date(seoulNow);
            target.setHours(h, m, 0, 0);
            calcOffset = target - seoulNow;
            update();
        }

        function resetCalc() { calcOffset = 0; document.getElementById('calc-input').value = ''; update(); }

        init();
    </script>
</body>
</html>

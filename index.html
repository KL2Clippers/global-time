<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GLOBAL OPS — World Time Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Outfit:wght@200;300;400;600;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#080a0f;--bg2:#0d1018;--bg3:#131620;
  --card:#10131c;--card-hover:#161a27;
  --border:rgba(255,255,255,0.06);--border-bright:rgba(255,255,255,0.12);
  --text:#e8eaf0;--text-muted:#5a6070;--text-dim:#3a4050;
  --accent-blue:#4a9fff;--accent-cyan:#00d4aa;--accent-amber:#ffb340;--accent-rose:#ff6b6b;
  --active:#00e887;--active-glow:rgba(0,232,135,0.2);--inactive:#2a3040;
  --region-am:#4a9fff;--region-eu:#a78bfa;--region-me:#ffb340;--region-as:#00d4aa;--region-kr:#ff6b9d;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Outfit',sans-serif;font-weight:300;min-height:100vh;overflow-x:hidden}
.wrapper{position:relative;z-index:1;max-width:1480px;margin:0 auto;padding:0 24px 80px}

/* HEADER */
header{display:flex;align-items:center;justify-content:space-between;padding:28px 0 20px;border-bottom:1px solid var(--border);flex-wrap:wrap;gap:16px}
.logo-group{display:flex;align-items:center;gap:14px}
.logo-mark{width:36px;height:36px;border-radius:8px;background:linear-gradient(135deg,var(--accent-blue),var(--accent-cyan));display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;color:#000;flex-shrink:0}
.logo-text{font-size:13px;font-weight:600;letter-spacing:.18em;text-transform:uppercase}
.seoul-hdr-time{font-family:'DM Mono',monospace;font-size:22px;font-weight:400;color:var(--accent-cyan);letter-spacing:.04em;line-height:1}

/* TOP SECTION */
.top-section{display:grid;grid-template-columns:1fr 340px;gap:16px;margin-top:24px;align-items:start}
.panel{background:var(--card);border:1px solid var(--border-bright);border-radius:16px;padding:20px 22px;position:relative;overflow:hidden}

/* MAP */
#worldSvg{width:100%;height:auto;display:block;border-radius:8px;background:#090c15}
.land-path{fill:#182030;stroke:rgba(255,255,255,0.1);stroke-width:0.6}
.pin-lbl{font-family:'Outfit',sans-serif;font-size:10px;font-weight:600;fill:#fff;text-shadow: 0 0 3px #000;}

/* SEOUL CARD */
.seoul-panel{background:var(--card);border:1px solid rgba(255,109,157,0.3);border-radius:16px;padding:20px 22px;text-align:center;box-shadow: 0 0 15px rgba(255,107,157,0.1);}
.seoul-big-time{font-family:'DM Mono',monospace;font-size:38px;font-weight:400;color:#fff;margin:10px 0}

/* CARDS GRID */
.regions{margin-top:32px;display:flex;flex-direction:column;gap:30px}
.region-hdr{display:flex;align-items:center;gap:12px;margin-bottom:13px}
.r-line{flex:1;height:1px;background:var(--border)}
.r-tag{padding:4px 13px;border-radius:100px;border:1px solid;font-size:10px;font-weight:700;text-transform:uppercase}
.cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:12px}
.c-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px 18px;transition:0.2s}
.c-card:hover{background:var(--card-hover);transform:translateY(-3px);border-color:var(--border-bright)}
.c-time{font-family:'DM Mono',monospace;font-size:26px;margin-bottom:5px}
.w-ind{font-size:9px;font-weight:700;padding:2px 7px;border-radius:100px;border:1px solid}
.w-ind.on{color:var(--active);border-color:rgba(0,232,135,0.3);background:rgba(0,232,135,0.08)}
.w-ind.off{color:var(--text-dim);border-color:var(--inactive)}

/* CALC */
.calc-section{margin-top:16px;background:var(--card);border:1px solid var(--border-bright);border-radius:16px;padding:20px 24px;border:1px solid var(--accent-blue);}
.calc-time{background:#1a1f2e;border:1px solid var(--border-bright);color:#fff;padding:8px;border-radius:6px;font-family:'DM Mono'}
.calc-btn{background:var(--accent-blue);border:none;padding:8px 16px;border-radius:6px;font-weight:700;cursor:pointer;color:#000}
</style>
</head>
<body>
<div class="wrapper">
<header>
  <div class="logo-group">
    <div class="logo-mark">G</div>
    <div><div class="logo-text">Global OPS Dashboard</div></div>
  </div>
  <div class="hdr-clock" id="hdrTime">00:00:00</div>
</header>

<div class="top-section">
  <div class="panel">
    <div style="font-size:11px;color:var(--text-muted);margin-bottom:15px;text-transform:uppercase">🌍 Real-time Market Map</div>
    <svg id="worldSvg" viewBox="0 0 1000 500">
      <g id="mapBase"></g>
      <g id="pinsLayer"></g>
    </svg>
  </div>
  <div class="seoul-panel">
    <div style="font-size:10px; color:var(--region-kr); letter-spacing:2px">HOME BASE: SEOUL</div>
    <div class="seoul-big-time" id="seoulBigTime">00:00:00</div>
    <div id="seoulDate" style="font-size:12px; color:var(--text-muted)">---</div>
  </div>
</div>

<div class="calc-section">
  <span style="font-size:13px; margin-right:10px">⏱ 시차 계산기 (서울 기준 시간 입력):</span>
  <input type="time" id="calcIn" class="calc-time">
  <button class="calc-btn" onclick="applyCalc()">전체 적용</button>
  <button onclick="resetCalc()" style="background:none; border:none; color:var(--text-muted); cursor:pointer; margin-left:10px">실시간 리셋</button>
</div>

<div class="regions" id="regionsWrap"></div>
</div>

<script>
const REGIONS=[
  {id:'am',label:'Americas',color:'#4a9fff',cities:[
    {name:'Dominican Rep.',tz:'America/Santo_Domingo',lat:18.5,lon:-69.9},
    {name:'Los Angeles',tz:'America/Los_Angeles',lat:34.1,lon:-118.2},
    {name:'San Francisco',tz:'America/Los_Angeles',lat:37.8,lon:-122.4}
  ]},
  {id:'eu',label:'Europe',color:'#a78bfa',cities:[
    {name:'Amsterdam',tz:'Europe/Amsterdam',lat:52.4,lon:4.9},
    {name:'Barcelona',tz:'Europe/Madrid',lat:41.4,lon:2.2},
    {name:'Geneva',tz:'Europe/Zurich',lat:46.2,lon:6.1},
    {name:'London',tz:'Europe/London',lat:51.5,lon:-0.1},
    {name:'Moscow',tz:'Europe/Moscow',lat:55.8,lon:37.6},
    {name:'Stockholm',tz:'Europe/Stockholm',lat:59.3,lon:18.1}
  ]},
  {id:'me',label:'Middle East & Africa',color:'#ffb340',cities:[
    {name:'Angola',tz:'Africa/Luanda',lat:-8.8,lon:13.2},
    {name:'Dubai',tz:'Asia/Dubai',lat:25.3,lon:55.3},
    {name:'Istanbul',tz:'Europe/Istanbul',lat:41.0,lon:29.0},
    {name:'Riyadh',tz:'Asia/Riyadh',lat:24.7,lon:46.7}
  ]},
  {id:'as',label:'Asia & Oceania',color:'#00d4aa',cities:[
    {name:'Melbourne',tz:'Australia/Melbourne',lat:-37.8,lon:144.9},
    {name:'Mumbai',tz:'Asia/Kolkata',lat:19.1,lon:72.9},
    {name:'Shanghai',tz:'Asia/Shanghai',lat:31.2,lon:121.5},
    {name:'Sydney',tz:'Australia/Sydney',lat:-33.9,lon:151.2}
  ]}
];

let calcOffset=0;
// 메르카토르 도법을 반영한 정밀 좌표 변환
const xy=(lat,lon)=>({
  x:(lon+180)*(1000/360),
  y:(500/2)-(1000*Math.log(Math.tan((Math.PI/4)+((lat*Math.PI/180)/2)))/(2*Math.PI)) + 20
});

function buildMap(){
  const base=document.getElementById('mapBase');
  // 정밀 세계 지형 데이터 (SVG Path)
  base.innerHTML=`<path class="land-path" d="M158,118 L185,114 L206,120 L212,134 L205,150 L188,156 L168,152 L156,140 L155,128 Z M52,158 L90,152 L128,148 L162,152 L182,166 L198,186 L204,208 L196,228 L183,244 L168,258 L156,272 L148,292 L142,314 L134,328 L120,338 L106,332 L96,314 L88,296 L78,278 L66,262 L54,246 L46,228 L43,208 L46,186 L52,168 Z M154,344 L176,338 L200,340 L222,350 L236,368 L246,390 L250,416 L248,442 L240,466 L226,484 L210,498 L196,500 L182,490 L172,472 L164,448 L160,422 L156,394 L152,368 L150,352 Z M468,136 L480,132 L494,136 L496,152 L488,162 L475,160 L466,150 Z M436,160 L464,154 L492,156 L512,164 L526,176 L524,190 L514,202 L500,208 L484,216 L468,220 L450,216 L438,204 L432,190 L432,174 Z M488,128 L550,122 L620,118 L690,120 L748,124 L790,132 L818,142 L828,156 L820,170 L800,178 L770,182 L738,182 L706,180 L674,184 L644,190 L612,192 L580,188 L550,184 L522,182 L500,188 L488,196 L480,186 L480,164 L484,144 Z M522,216 L556,212 L582,216 L596,226 L594,238 L578,244 L558,240 L538,234 L524,224 Z M560,264 L594,254 L616,262 L630,278 L632,300 L620,318 L600,326 L580,320 L564,304 L556,282 Z M452,226 L492,220 L524,224 L544,238 L552,260 L548,288 L538,318 L528,350 L518,380 L512,410 L510,440 L508,464 L500,482 L488,492 L474,488 L460,472 L450,450 L444,422 L442,394 L440,364 L436,336 L432,308 L430,278 L432,254 L440,238 Z M616,230 L644,224 L668,232 L678,248 L680,270 L670,292 L654,308 L636,312 L620,300 L610,280 L610,254 Z M706,180 L752,176 L792,182 L820,192 L832,208 L828,226 L812,236 L788,242 L760,242 L736,238 L714,230 L700,216 L698,200 Z M756,408 L802,398 L840,402 L868,416 L880,438 L878,462 L862,480 L838,490 L810,492 L782,486 L760,470 L746,448 L744,426 Z"/>`;
  
  const pins=document.getElementById('pinsLayer');
  REGIONS.forEach(r=>{
    r.cities.forEach(c=>{
      const pos=xy(c.lat,c.lon);
      pins.innerHTML+=`<circle cx="${pos.x}" cy="${pos.y}" r="4.5" fill="${r.color}" style="filter: drop-shadow(0 0 3px ${r.color})"/>
      <text x="${pos.x+7}" y="${pos.y+3}" class="pin-lbl">${c.name}</text>`;
    });
  });
}

function update(){
  const now=new Date(Date.now()+calcOffset);
  const seoulTime=now.toLocaleTimeString('en-GB',{timeZone:'Asia/Seoul'});
  document.getElementById('hdrTime').textContent=seoulTime;
  document.getElementById('seoulBigTime').textContent=seoulTime;
  document.getElementById('seoulDate').textContent=now.toLocaleDateString('ko-KR',{weekday:'long',month:'long',day:'numeric'});

  REGIONS.forEach(r=>{
    r.cities.forEach((c,i)=>{
      const timeStr=now.toLocaleTimeString('en-GB',{timeZone:c.tz,hour:'2-digit',minute:'2-digit'});
      const hour=parseInt(timeStr.split(':')[0]);
      const isOpen=hour>=9 && hour<18;
      
      const tEl=document.getElementById(`tm-${r.id}-${i}`);
      const sEl=document.getElementById(`st-${r.id}-${i}`);
      const oEl=document.getElementById(`of-${r.id}-${i}`);
      
      if(tEl){
        tEl.textContent=timeStr;
        sEl.textContent=isOpen?'OPEN':'OFF';
        sEl.className=`w-ind ${isOpen?'on':'off'}`;
        
        const sNow=new Date(now.toLocaleString('en-US',{timeZone:'Asia/Seoul'}));
        const cNow=new Date(now.toLocaleString('en-US',{timeZone:c.tz}));
        const diff=Math.round((cNow-sNow)/3600000);
        oEl.textContent=`${diff>=0?'+'+diff:diff}h vs Seoul`;
      }
    });
  });
}

function initCards(){
  const wrap=document.getElementById('regionsWrap');
  REGIONS.forEach(r=>{
    const sec=document.createElement('div');
    sec.className='region-group';
    sec.innerHTML=`<div class="region-hdr"><div class="r-tag" style="color:${r.color}; border-color:${r.color}">${r.label}</div><div class="r-line"></div></div><div class="cards-grid" id="grid-${r.id}"></div>`;
    wrap.appendChild(sec);
    r.cities.forEach((c,i)=>{
      document.getElementById(`grid-${r.id}`).innerHTML+=`
        <div class="c-card">
          <div class="card-top"><strong>${c.name}</strong><span class="w-ind" id="st-${r.id}-${i}">OFF</span></div>
          <div class="c-time" id="tm-${r.id}-${i}">00:00</div>
          <div id="of-${r.id}-${i}" style="font-size:9px; color:var(--text-dim); margin-top:5px; font-family: 'DM Mono'">-0h vs Seoul</div>
        </div>`;
    });
  });
}

function applyCalc(){
  const val=document.getElementById('calcIn').value;
  if(!val)return;
  const [h,m]=val.split(':').map(Number);
  const sNow=new Date(new Date().toLocaleString("en-US",{timeZone:"Asia/Seoul"}));
  const target=new Date(sNow); target.setHours(h,m,0,0);
  calcOffset=target-sNow; update();
}
function resetCalc(){calcOffset=0; document.getElementById('calcIn').value=''; update();}

initCards(); buildMap(); update(); setInterval(update,1000);
</script>
</body>
</html>

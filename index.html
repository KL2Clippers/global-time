<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GLOBAL OPS — World Time Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Outfit:wght@200;300;400;600;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#080a0f;--bg2:#0d1018;--card:#10131c;--card-hover:#161a27;
  --border:rgba(255,255,255,0.06);--border-bright:rgba(255,255,255,0.12);
  --text:#e8eaf0;--text-muted:#5a6070;--text-dim:#3a4050;
  --accent-blue:#4a9fff;--accent-cyan:#00d4aa;--accent-amber:#ffb340;
  --active:#00e887;--inactive:#2a3040;
  --region-am:#4a9fff;--region-eu:#a78bfa;--region-me:#ffb340;--region-as:#00d4aa;--region-kr:#ff6b9d;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Outfit',sans-serif;font-weight:300;min-height:100vh;overflow-x:hidden}
.wrapper{max-width:1480px;margin:0 auto;padding:0 24px 80px}

/* HEADER */
header{display:flex;align-items:center;justify-content:space-between;padding:28px 0 20px;border-bottom:1px solid var(--border)}
.logo-group{display:flex;align-items:center;gap:14px}
.logo-mark{width:36px;height:36px;border-radius:8px;background:linear-gradient(135deg,var(--accent-blue),var(--accent-cyan));display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;color:#000}
.logo-text{font-size:13px;font-weight:600;letter-spacing:.18em;text-transform:uppercase}
.seoul-hdr{text-align:right}
.seoul-hdr-time{font-family:'DM Mono',monospace;font-size:22px;color:var(--accent-cyan)}

/* MAP PANEL - 육지가 표시되도록 개선 */
.top-section{display:grid;grid-template-columns:1fr 340px;gap:16px;margin-top:24px}
.panel{background:var(--card);border:1px solid var(--border-bright);border-radius:16px;padding:20px 22px;position:relative;overflow:hidden}
#worldMap{width:100%;height:auto;background:#0d111a;border-radius:8px;display:block}
.land{fill:#1e2533;stroke:#2d364a;stroke-width:0.5} /* 육지 색상 */

/* CARDS */
.regions{margin-top:32px;display:flex;flex-direction:column;gap:32px}
.region-hdr{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.r-line{flex:1;height:1px;background:var(--border)}
.r-tag{padding:4px 12px;border-radius:100px;border:1px solid;font-size:10px;font-weight:700;text-transform:uppercase}
.cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.c-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;transition:all .2s}
.c-card:hover{background:var(--card-hover);transform:translateY(-2px)}
.c-top{display:flex;justify-content:space-between;margin-bottom:12px}
.c-name{font-size:15px;font-weight:600}
.c-time{font-family:'DM Mono',monospace;font-size:28px;line-height:1;margin-bottom:6px}
.w-ind{display:flex;align-items:center;gap:5px;font-size:9px;font-weight:700;padding:2px 8px;border-radius:100px;border:1px solid}
.w-ind.on{color:var(--active);border-color:rgba(0,232,135,.3);background:rgba(0,232,135,.08)}
.w-ind.off{color:var(--text-dim);border-color:var(--inactive)}

/* CALCULATOR */
.calc-section{margin-top:24px;background:var(--card);border:1px solid var(--accent-blue);border-radius:16px;padding:20px 24px}
.calc-time{background:#1a1f2e;border:1px solid var(--border-bright);color:#fff;padding:8px;border-radius:6px;font-family:'DM Mono'}
.calc-btn{background:var(--accent-blue);border:none;padding:8px 16px;border-radius:6px;font-weight:700;cursor:pointer}
</style>
</head>
<body>
<div class="wrapper">
  <header>
    <div class="logo-group">
      <div class="logo-mark">G</div>
      <div><div class="logo-text">Global OPS Dashboard</div></div>
    </div>
    <div class="seoul-hdr">
      <div style="font-size:10px;color:var(--text-muted)">SEOUL BASE</div>
      <div class="seoul-hdr-time" id="hdrTime">00:00:00</div>
    </div>
  </header>

  <div class="top-section">
    <div class="panel">
      <div style="font-size:11px;color:var(--text-muted);margin-bottom:10px;text-transform:uppercase">🌍 Live Market Presence</div>
      <svg id="worldMap" viewBox="0 0 1000 500">
        <rect width="1000" height="500" fill="#0d111a"/>
        <g class="land">
          <path d="M160,100 L250,80 L350,150 L320,300 L200,450 L100,350 L50,150 Z"/> <path d="M450,50 L600,30 L800,50 L950,150 L850,350 L700,400 L500,350 L450,200 Z"/> <path d="M750,300 L850,300 L900,400 L800,450 Z"/> </g>
        <g id="pinsLayer"></g>
      </svg>
    </div>
    <div class="panel" style="display:flex;flex-direction:column;justify-content:center;text-align:center;">
        <div style="font-size:40px;margin-bottom:10px;">🇰🇷</div>
        <div style="font-size:18px;font-weight:700;">Seoul, Korea</div>
        <div id="seoulTime" style="font-size:32px;font-family:'DM Mono';color:var(--accent-cyan);margin:10px 0;">--:--:--</div>
        <div id="seoulDate" style="font-size:12px;color:var(--text-muted);">---</div>
    </div>
  </div>

  <div class="calc-section">
    <span style="font-size:13px;margin-right:15px;">⏱ 시차 계산기 (서울 기준):</span>
    <input type="time" id="calcIn" class="calc-time">
    <button class="calc-btn" onclick="applyCalc()">시간 적용</button>
    <button onclick="resetCalc()" style="background:none;border:none;color:var(--text-muted);cursor:pointer;margin-left:10px;">리셋</button>
  </div>

  <div class="regions" id="regionsWrap"></div>
</div>

<script>
const REGIONS=[
  {id:'am',label:'Americas',color:'#4a9fff',cities:[
    {name:'Dominican Republic',tz:'America/Santo_Domingo',lat:18.4,lon:-69.9, country:'DOM'},
    {name:'Los Angeles',tz:'America/Los_Angeles',lat:34.0,lon:-118.2, country:'USA'},
    {name:'San Francisco',tz:'America/Los_Angeles',lat:37.7,lon:-122.4, country:'USA'}
  ]},
  {id:'eu',label:'Europe',color:'#a78bfa',cities:[
    {name:'Amsterdam',tz:'Europe/Amsterdam',lat:52.3,lon:4.9, country:'NED'},
    {name:'Barcelona',tz:'Europe/Madrid',lat:41.3,lon:2.1, country:'SPA'},
    {name:'Geneva',tz:'Europe/Zurich',lat:46.2,lon:6.1, country:'SUI'},
    {name:'London',tz:'Europe/London',lat:51.5,lon:-0.1, country:'UK'},
    {name:'Moscow',tz:'Europe/Moscow',lat:55.7,lon:37.6, country:'RUS'},
    {name:'Stockholm',tz:'Europe/Stockholm',lat:59.3,lon:18.0, country:'SWE'}
  ]},
  {id:'me',label:'Middle East & Africa',color:'#ffb340',cities:[
    {name:'Angola',tz:'Africa/Luanda',lat:-8.8,lon:13.2, country:'ANG'},
    {name:'Dubai',tz:'Asia/Dubai',lat:25.2,lon:55.2, country:'UAE'},
    {name:'Istanbul',tz:'Europe/Istanbul',lat:41.0,lon:28.9, country:'TUR'},
    {name:'Riyadh',tz:'Asia/Riyadh',lat:24.6,lon:46.7, country:'KSA'}
  ]},
  {id:'as',label:'Asia & Oceania',color:'#00d4aa',cities:[
    {name:'Melbourne',tz:'Australia/Melbourne',lat:-37.8,lon:144.9, country:'AUS'},
    {name:'Mumbai',tz:'Asia/Kolkata',lat:19.0,lon:72.8, country:'IND'},
    {name:'Shanghai',tz:'Asia/Shanghai',lat:31.2,lon:121.4, country:'CHN'},
    {name:'Sydney',tz:'Australia/Sydney',lat:-33.8,lon:151.2, country:'AUS'}
  ]}
];

let calcOffset = 0;
const xy=(lat,lon)=>({x:(lon+180)/360*1000, y:(90-lat)/180*500});

function buildDashboard() {
  const wrap = document.getElementById('regionsWrap');
  const pins = document.getElementById('pinsLayer');
  wrap.innerHTML = ''; pins.innerHTML = '';

  REGIONS.forEach(reg => {
    const sec = document.createElement('div');
    sec.innerHTML = `<div class="region-hdr"><div class="r-tag" style="color:${reg.color};border-color:${reg.color}66">${reg.label}</div><div class="r-line"></div></div><div class="cards-grid" id="grid-${reg.id}"></div>`;
    wrap.appendChild(sec);

    reg.cities.forEach((c, i) => {
      const grid = document.getElementById(`grid-${reg.id}`);
      const card = document.createElement('div');
      card.className = 'c-card';
      card.innerHTML = `<div class="c-top"><div><div class="c-name">${c.name}</div><div style="font-size:10px;color:var(--text-muted)">${c.country}</div></div><div class="w-ind" id="wi-${reg.id}-${i}">● OFF</div></div><div class="c-time" id="ct-${reg.id}-${i}">--:--</div><div style="font-size:10px;color:var(--text-dim)" id="cd-${reg.id}-${i}">--</div>`;
      grid.appendChild(card);

      const pos = xy(c.lat, c.lon);
      const dot = document.createElementNS("http://www.w3.org/2000/svg", "circle");
      dot.setAttribute("cx", pos.x); dot.setAttribute("cy", pos.y); dot.setAttribute("r", 4);
      dot.setAttribute("fill", reg.color);
      pins.appendChild(dot);
      const txt = document.createElementNS("http://www.w3.org/2000/svg", "text");
      txt.setAttribute("x", pos.x+6); txt.setAttribute("y", pos.y+2);
      txt.setAttribute("fill", "#fff"); txt.setAttribute("font-size", "9");
      txt.textContent = c.name.substring(0,3);
      pins.appendChild(txt);
    });
  });
}

function update() {
  const now = new Date(Date.now() + calcOffset);
  document.getElementById('hdrTime').textContent = now.toLocaleTimeString('en-GB', {timeZone:'Asia/Seoul'});
  document.getElementById('seoulTime').textContent = now.toLocaleTimeString('en-GB', {timeZone:'Asia/Seoul'});
  document.getElementById('seoulDate').textContent = now.toLocaleDateString('ko-KR', {weekday:'long', month:'long', day:'numeric'});

  REGIONS.forEach(reg => {
    reg.cities.forEach((c, i) => {
      const timeStr = now.toLocaleTimeString('en-GB', {timeZone:c.tz, hour:'2-digit', minute:'2-digit'});
      const hour = parseInt(timeStr.split(':')[0]);
      document.getElementById(`ct-${reg.id}-${i}`).textContent = timeStr;
      document.getElementById(`cd-${reg.id}-${i}`).textContent = now.toLocaleDateString('en-GB', {timeZone:c.tz, month:'short', day:'numeric'});
      
      const isOpen = hour >= 9 && hour < 18;
      const ind = document.getElementById(`wi-${reg.id}-${i}`);
      ind.textContent = isOpen ? '● OPEN' : '● OFF';
      ind.className = `w-ind ${isOpen ? 'on' : 'off'}`;
    });
  });
}

function applyCalc() {
  const val = document.getElementById('calcIn').value;
  if(!val) return;
  const [h, m] = val.split(':').map(Number);
  const seoulNow = new Date(new Date().toLocaleString("en-US", {timeZone: "Asia/Seoul"}));
  const target = new Date(seoulNow);
  target.setHours(h, m, 0, 0);
  calcOffset = target - seoulNow;
  update();
}

function resetCalc() { calcOffset = 0; update(); }

buildDashboard();
setInterval(update, 1000);
update();
</script>
</body>
</html>
